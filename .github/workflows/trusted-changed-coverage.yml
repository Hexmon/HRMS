name: Trusted changed executable coverage

# This workflow becomes authoritative only after an organization ruleset pins
# this exact file to an independently reviewed immutable commit SHA. A normal
# repository workflow or required status name is not an equivalent trust anchor.
on:
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

jobs:
  trusted-changed-coverage:
    name: Trusted changed executable coverage
    runs-on: ubuntu-latest
    # Real PostgreSQL integration execution contributes to the trusted backend
    # report, so match the bounded disposable services and backend-sized timeout
    # used by the ordinary diagnostic coverage job.
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    services:
      postgres:
        # postgis/postgis:16-3.5-alpine
        image: postgis/postgis@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
        env:
          POSTGRES_DB: hrms_coverage_test
          POSTGRES_USER: hrms_coverage
          POSTGRES_PASSWORD: coverage
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hrms_coverage -d hrms_coverage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        # valkey/valkey:9.0.3-alpine
        image: valkey/valkey@sha256:e1095c6c76ee982cb2d1e07edbb7fb2a53606630a1d810d5a47c9f646b708bf5
        ports:
          - 56380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Validate immutable workflow identity
        shell: bash
        env:
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$TRUSTED_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COVERAGE_BASE" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out validator from the required workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted

      - name: Verify trusted and candidate revisions
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor "$COVERAGE_BASE" "$CANDIDATE_SHA"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up pinned package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pinned_pnpm="$RUNNER_TEMP/hrms-pnpm-bin/pnpm"
          mkdir -p "$(dirname "$pinned_pnpm")"
          printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm@10.25.0 "$@"' > "$pinned_pnpm"
          chmod 0555 "$pinned_pnpm"
          test "$("$pinned_pnpm" --version)" = "10.25.0"
          printf '%s\n' "$(dirname "$pinned_pnpm")" >> "$GITHUB_PATH"

      - name: Install immutable validator dependencies
        run: pnpm --dir trusted/hrms_backend install --frozen-lockfile --ignore-scripts

      - name: Install candidate dependencies
        run: |
          pnpm --dir candidate/hrms_backend install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          pnpm --dir candidate/hrms-client install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Install pinned Python coverage runner
        shell: bash
        run: |
          python3 -m venv --copies "$RUNNER_TEMP/hrms-coverage-python"
          "$RUNNER_TEMP/hrms-coverage-python/bin/python3" -m pip install --disable-pip-version-check coverage==7.11.0
          test "$(realpath "$RUNNER_TEMP/hrms-coverage-python/bin/python3")" = "$RUNNER_TEMP/hrms-coverage-python/bin/python3"

      - name: Run immutable validator against candidate
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          export PATH="$RUNNER_TEMP/hrms-coverage-python/bin:$PATH"
          validator="$GITHUB_WORKSPACE/trusted/scripts/agent/changed-coverage.mjs"
          candidate="$GITHUB_WORKSPACE/candidate"
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)"
          HRMS_COVERAGE_REPO_ROOT="$candidate" node "$validator" \
            --run-full-suite \
            --confirm-disposable-services \
            --base "$COVERAGE_BASE" \
            --head "$CANDIDATE_SHA" \
            --trusted-validator "$validator"
