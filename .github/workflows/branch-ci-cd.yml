name: Branch CI/CD

on:
  push:
    branches:
      - dev
      - qa
      - main
      - "release-*"
  pull_request:
    branches:
      - dev
      - qa
      - main
      - "release-*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: branch-ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    # The serial PostgreSQL integration suite took ~44 minutes locally on
    # 2026-10-23; install, migration, build and slower CI runners need margin.
    timeout-minutes: 90
    env:
      NODE_ENV: test
      BUILD_SHA: ${{ github.sha }}
      TEST_DATABASE_URL: postgresql://hrms_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/hrms_ci_test
      VALKEY_URL: redis://127.0.0.1:6379
      CLOUDINARY_MOCK_UPLOADS: "true"
      EMAIL_DELIVERY_MODE: log
      LOCAL_DEMO_PASSWORD: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}-A1!
      JWT_ACCESS_SECRET: ci-access-${{ github.run_id }}-${{ github.run_attempt }}-secret
      JWT_REFRESH_SECRET: ci-refresh-${{ github.run_id }}-${{ github.run_attempt }}-secret
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: hrms_ci_test
          POSTGRES_USER: hrms_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms_ci -d hrms_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:9.0.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: hrms_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: hrms_backend/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: hrms_backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Verify database constraints
        run: pnpm db:verify:no-cross-schema-fks

      - name: Test
        run: pnpm test

      - name: Verify local Cloudflare Queue DLQ and replay
        run: pnpm verify:cloudflare-queue-dlq

      - name: Build
        run: pnpm build

      - name: Bundle Cloudflare Worker environments
        run: |
          for target in dev qa production; do
            pnpm exec wrangler deploy --env "$target" --dry-run --outdir "/tmp/hrms-worker-$target"
          done

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: 0.1.0-ci
      VITE_BUILD_SHA: ${{ github.sha }}
      VITE_API_BASE_URL: http://127.0.0.1:3001
      VITE_API_ENABLED: "true"
      VITE_API_MOCK_FALLBACK: "false"
    defaults:
      run:
        working-directory: hrms-client
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: hrms-client/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: hrms-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production API mode guard
        run: pnpm api:production-config-guard

      - name: Build Vercel frontend
        run: pnpm build:vercel

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - frontend-checks
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/qa' ||
      github.ref == 'refs/heads/main')
    environment: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'qa' && 'qa' || 'production' }}
    timeout-minutes: 10
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          case "$DEPLOY_BRANCH" in
            dev) target="dev" ;;
            qa) target="qa" ;;
            main) target="production" ;;
            *) echo "Unsupported deployment branch." >&2; exit 1 ;;
          esac

          case "$target" in
            dev)
              echo "api_hook_secret=DEV_RENDER_API_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "worker_hook_secret=DEV_RENDER_WORKER_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "cutover_var=DEV_HRMS_CLOUDFLARE_CUTOVER_ACTIVE" >> "$GITHUB_OUTPUT"
              echo "legacy_present_var=DEV_RENDER_LEGACY_WORKER_PRESENT" >> "$GITHUB_OUTPUT"
              ;;
            qa)
              echo "api_hook_secret=QA_RENDER_API_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "worker_hook_secret=QA_RENDER_WORKER_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "cutover_var=QA_HRMS_CLOUDFLARE_CUTOVER_ACTIVE" >> "$GITHUB_OUTPUT"
              echo "legacy_present_var=QA_RENDER_LEGACY_WORKER_PRESENT" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "api_hook_secret=PROD_RENDER_API_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "worker_hook_secret=PROD_RENDER_WORKER_DEPLOY_HOOK_URL" >> "$GITHUB_OUTPUT"
              echo "cutover_var=PROD_HRMS_CLOUDFLARE_CUTOVER_ACTIVE" >> "$GITHUB_OUTPUT"
              echo "legacy_present_var=PROD_RENDER_LEGACY_WORKER_PRESENT" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unsupported target $target" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy hooks
        shell: bash
        env:
          DEV_HRMS_CLOUDFLARE_CUTOVER_ACTIVE: ${{ vars.DEV_HRMS_CLOUDFLARE_CUTOVER_ACTIVE }}
          QA_HRMS_CLOUDFLARE_CUTOVER_ACTIVE: ${{ vars.QA_HRMS_CLOUDFLARE_CUTOVER_ACTIVE }}
          PROD_HRMS_CLOUDFLARE_CUTOVER_ACTIVE: ${{ vars.PROD_HRMS_CLOUDFLARE_CUTOVER_ACTIVE }}
          DEV_RENDER_LEGACY_WORKER_PRESENT: ${{ vars.DEV_RENDER_LEGACY_WORKER_PRESENT }}
          QA_RENDER_LEGACY_WORKER_PRESENT: ${{ vars.QA_RENDER_LEGACY_WORKER_PRESENT }}
          PROD_RENDER_LEGACY_WORKER_PRESENT: ${{ vars.PROD_RENDER_LEGACY_WORKER_PRESENT }}
          DEV_RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.DEV_RENDER_API_DEPLOY_HOOK_URL }}
          DEV_RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.DEV_RENDER_WORKER_DEPLOY_HOOK_URL }}
          QA_RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.QA_RENDER_API_DEPLOY_HOOK_URL }}
          QA_RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.QA_RENDER_WORKER_DEPLOY_HOOK_URL }}
          PROD_RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.PROD_RENDER_API_DEPLOY_HOOK_URL }}
          PROD_RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.PROD_RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          api_var="${{ steps.target.outputs.api_hook_secret }}"
          worker_var="${{ steps.target.outputs.worker_hook_secret }}"
          cutover_var="${{ steps.target.outputs.cutover_var }}"
          legacy_present_var="${{ steps.target.outputs.legacy_present_var }}"
          api_hook="${!api_var:-}"
          worker_hook="${!worker_var:-}"
          cutover_active="${!cutover_var:-}"
          legacy_present="${!legacy_present_var:-}"

          if [[ -z "$api_hook" ]]; then
            echo "Missing Render API deploy hook secret: $api_var" >&2
            exit 1
          fi

          if [[ "$cutover_active" != "true" && "$legacy_present" != "false" && -z "$worker_hook" ]]; then
            echo "Missing legacy Render worker deploy hook secret: $worker_var" >&2
            exit 1
          fi

          curl -fsS -X POST "$api_hook"
          if [[ "$cutover_active" == "true" ]]; then
            echo "Triggered Render API only; Cloudflare worker cutover is active."
          elif [[ "$legacy_present" == "false" ]]; then
            echo "Triggered Render API only; legacy Render worker is explicitly marked absent."
          else
            curl -fsS -X POST "$worker_hook"
            echo "Triggered Render API and legacy worker deploys for ${{ steps.target.outputs.target }}."
          fi
