# Fully containerized synthetic-user stack. Use an isolated Compose project name;
# never point these services at Neon, Upstash or other hosted data.
x-backend-build: &backend-build
  context: ../..
  dockerfile: infra/docker/Dockerfile

x-backend-environment: &backend-environment
  NODE_ENV: development
  APP_ENV: local
  PORT: "3001"
  LOG_LEVEL: error
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/hrms_platform
  TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hrms_platform_test
  VALKEY_URL: redis://valkey:6379
  HRMS_DATA_STORE: postgres
  CLOUDINARY_MOCK_UPLOADS: "true"
  CLOUDINARY_CLOUD_NAME: local-cloudinary-mock
  CLOUDINARY_API_KEY: local-cloudinary-key
  CLOUDINARY_API_SECRET: local-cloudinary-secret
  JWT_ACCESS_SECRET: local-e2e-access-secret-change-me
  JWT_REFRESH_SECRET: local-e2e-refresh-secret-change-me
  LOCAL_DEMO_PASSWORD: LocalDev@123
  COOKIE_SECURE: "false"
  CORS_ALLOWED_ORIGINS: http://localhost:5173

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: hrms_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_TEST_DB: hrms_platform_test
    ports:
      - "${E2E_POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  valkey:
    image: valkey/valkey:9.0.3-alpine
    ports:
      - "${E2E_VALKEY_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: *backend-build
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["sh", "-lc", "pnpm db:migrate && pnpm release:seed && pnpm release:seed:attendance-demo && pnpm exec tsx scripts/seed-cloudflare-e2e-persona.ts"]
    restart: "no"

  api:
    build: *backend-build
    environment:
      <<: *backend-environment
      OUTBOX_DRAIN_URL: http://worker:8787/internal/outbox-signal
      OUTBOX_DRAIN_TOKEN: local-e2e-worker-token
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    ports:
      - "${E2E_API_HOST_PORT:-3001}:3001"
    command: ["pnpm", "start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cloudflare-e2e-worker
    environment:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@postgres:5432/hrms_platform
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${E2E_WORKER_HOST_PORT:-8787}:8787"
    command: ["pnpm", "exec", "wrangler", "dev", "--ip", "0.0.0.0", "--port", "8787", "--var", "OUTBOX_SIGNAL_TOKEN:local-e2e-worker-token", "--var", "WORKER_ACTIVE:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../../../hrms-client
      dockerfile: Dockerfile.e2e
    environment:
      NODE_ENV: production
    extra_hosts: ["hostmachine:host-gateway"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${E2E_FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  browser:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: [test]
    init: true
    ipc: host
    extra_hosts: ["hostmachine:host-gateway"]
    volumes:
      - ../../../:/workspace
    working_dir: /workspace/hrms-client
    environment:
      E2E_WORKER_UPSTREAM_PORT: "8787"
      E2E_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hrms_platform
    depends_on:
      frontend:
        condition: service_healthy
    command: ["node", "scripts/run-container-browser-tests.mjs", "e2e/background-worker-real-user.spec.ts", "--reporter=list"]

volumes:
  postgres-data:
